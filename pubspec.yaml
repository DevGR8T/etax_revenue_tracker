name: etax_revenue_tracker
description: eTax Revenue Tracker — citizen tax payment app

publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  hydrated_bloc: ^9.1.5

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.1

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # Local Database — Offline First
  drift: ^2.18.0
  drift_flutter: ^0.2.0

  # Background Sync
  workmanager: ^0.5.2

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Navigation
  go_router: ^14.2.7

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1

  # Security
  local_auth: ^2.3.0
  flutter_jailbreak_detection: ^1.9.0

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.0.0
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2
  dartz: ^0.10.1

  # Error Tracking
  sentry_flutter: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.3
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  drift_dev: ^2.18.0

flutter:
  assets:
    - .env
    - assets/certs/