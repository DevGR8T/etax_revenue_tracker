name: etax_revenue_tracker
description: eTax Revenue Tracker — citizen tax payment app

publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  hydrated_bloc: ^11.0.0

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^7.1.1
  supabase_flutter: ^2.12.4

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.4.1

  # Local Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # Local Database — Offline First
  drift: ^2.18.0
  drift_flutter: ^0.2.0

  # Background Sync
  workmanager: ^0.9.0+3

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0

  # Notifications
  flutter_local_notifications: ^20.1.0

  # Navigation
  go_router: ^17.2.2

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^8.1.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1

  # Security
  local_auth: 2.3.0
  safe_device: ^1.1.4

  # Utilities
  intl: ^0.20.2
  share_plus: ^10.0.0
  flutter_dotenv: ^6.0.1
  uuid: ^4.4.2
  dartz: ^0.10.1

  # Error Tracking
  sentry_flutter: ^9.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/certs/
    - .env